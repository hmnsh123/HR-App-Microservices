services:
  mysql:
    image: mysql:8.4
    container_name: hr-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: hr_db
      MYSQL_USER: hr_user
      MYSQL_PASSWORD: hrpass123

    ports:
      - "3307:3306"

    volumes:
      - hr_mysql_data:/var/lib/mysql

volumes:
  hr_mysql_data: